[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "youtube-transcript-apify"
version = "0.1.0"
description = "YouTube transcript API for Python that works on AWS, GCP and Vercel: a drop-in fix for youtube-transcript-api RequestBlocked / IpBlocked errors. Text, SRT, VTT, CLI and MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nokia2k" }]
requires-python = ">=3.9"
keywords = ["youtube", "youtube-transcript", "youtube-transcript-api", "transcript", "subtitles", "captions", "srt", "vtt", "requestblocked", "ipblocked", "mcp", "mcp-server", "langchain", "document-loader", "rag", "ai-agents", "apify"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing",
]
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
mcp = []  # kept so `pip install "youtube-transcript-apify[mcp]"` still works
langchain = ["langchain-core>=0.2"]

[project.scripts]
yt-transcript-apify = "yt_transcript_apify.cli:main"
yt-transcript-apify-mcp = "yt_transcript_apify.mcp_server:main"
youtube-transcript-apify = "yt_transcript_apify.mcp_server:main"

[project.urls]
Source = "https://github.com/nokia2k2/youtube-transcript-apify"
"Apify Actor" = "https://apify.com/nokia2k/youtube-transcript-scraper"
"Bulk plain text" = "https://apify.com/nokia2k/youtube-video-to-text"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_transcript_apify"]

[tool.pytest.ini_options]
pythonpath = ["src"]
